name: cm_movies
description: CM Movies App
version: 1.8.0+10

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  cached_network_image: ^3.3.0
  url_launcher: ^6.2.2
  dio: ^5.4.0
  # Video Player - media_kit (libmpv/VLC engine) for MKV/4K/HEVC support
  # Pin exact versions for Flutter 3.24.5 compatibility:
  # - media_kit_video 1.3.x requires Flutter 3.29+ (SurfaceProducer.Callback changed)
  # - media_kit_video 1.2.5 is the last version compatible with Flutter 3.24.x
  media_kit: 1.1.11
  media_kit_video: 1.2.5
  media_kit_libs_video: 1.0.5
  # Android native libraries - latest libmpv with full FFmpeg software decoders
  # Required for 4K HEVC playback on devices where hardware decoder doesn't support 4K
  media_kit_libs_android_video: ^1.3.6
  path_provider: ^2.1.2
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.0
  open_filex: ^4.5.0
  flutter_dotenv: ^5.1.0
  flutter_secure_storage: ^9.2.2
  # Screen brightness control for video player
  # Must use ^0.2.x — media_kit_video 1.2.5 depends on screen_brightness ^0.2.2
  screen_brightness: ^0.2.2
  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_app_check: ^0.3.0

# Force compatible versions for Flutter 3.24.5 / AGP 8.2
dependency_overrides:
  package_info_plus: 8.1.2
  wakelock_plus: 1.2.8
  # Pin media_kit versions for Flutter 3.24.5 compatibility
  media_kit: 1.1.11
  media_kit_video: 1.2.5
  media_kit_libs_video: 1.0.5
  media_kit_libs_android_video: ^1.3.6

flutter:
  uses-material-design: true
  assets:
    - assets/lang/
    - assets/
    - .env
