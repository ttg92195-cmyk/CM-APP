name: cm_movies
description: CM Movies App
version: 1.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  cached_network_image: ^3.3.0
  url_launcher: ^6.2.2
  dio: ^5.4.0
  chewie: ^1.8.1
  video_player: ^2.9.2
  path_provider: ^2.1.2
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.0
  open_filex: ^4.5.0
  flutter_dotenv: ^5.1.0
  flutter_secure_storage: ^9.2.2
  wakelock_plus: ^1.2.8
  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_app_check: ^0.3.0

# Force compatible versions for Flutter 3.24.5 / AGP 8.2
dependency_overrides:
  package_info_plus: 8.1.2

flutter:
  uses-material-design: true
  assets:
    - assets/lang/
    - assets/
    - .env
