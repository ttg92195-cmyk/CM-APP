allprojects {
    repositories {
        google()
        mavenCentral()
    }
    // Force all Kotlin dependencies to version 2.1.0 to match our Kotlin compiler.
    // Transitive dependencies (e.g. screen_brightness_android:2.1.4) may pull in
    // kotlin-stdlib:2.3.21 which has metadata version 2.3.0 that our Kotlin 2.1.0
    // compiler cannot read. Forcing to 2.1.0 prevents this incompatibility.
    configurations.all {
        resolutionStrategy {
            eachDependency { details ->
                if (details.requested.group == 'org.jetbrains.kotlin') {
                    details.useVersion '2.1.0'
                }
            }
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    afterEvaluate {
        if (project.hasProperty('android')) {
            project.android.compileSdkVersion 36
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
