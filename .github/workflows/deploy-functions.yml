name: Deploy Cloud Functions

# Deploys Firebase Cloud Functions (functions/index.js) to the Firebase
# project. This workflow is the BULLETPROOF fix for the /users/{uid} doc
# creation problem — the onUserCreated Auth trigger fires server-side
# whenever a new Firebase Auth user is created, and writes the profile
# doc using the Admin SDK (which bypasses Firestore rules entirely).
#
# WHEN TO RUN:
#   - Manually via workflow_dispatch (click "Run workflow" in the Actions tab)
#   - Automatically when functions/index.js or functions/package.json changes
#     on the main branch
#
# PREREQUISITE:
#   Bro must add a GitHub secret called FIREBASE_SERVICE_ACCOUNT containing
#   the Firebase service account JSON key. To generate it:
#     1. Go to Firebase Console → Project Settings → Service Accounts
#     2. Click "Generate New Private Key" → download the JSON file
#     3. Go to GitHub repo → Settings → Secrets and variables → Actions
#     4. Click "New repository secret"
#     5. Name: FIREBASE_SERVICE_ACCOUNT
#     6. Value: paste the ENTIRE contents of the downloaded JSON file
#     7. Click "Add secret"
#
#   Once the secret is added, this workflow will deploy the Cloud Functions
#   automatically on the next push to main (or when manually triggered).

on:
  push:
    branches: [ main ]
    paths:
      - 'functions/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:  # Allow manual trigger from Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only run if the FIREBASE_SERVICE_ACCOUNT secret is set. If not set,
    # the workflow is skipped silently (no error) so that Bro can push
    # code changes without breaking CI when the secret isn't configured yet.
    if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Install Cloud Functions dependencies
        run: |
          cd functions
          npm install

      - name: Deploy Cloud Functions
        uses: w9jds/firebase-action@v13.6.0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: cm-movies-dabab
          args: deploy --only functions:onUserCreated --force

      - name: Print deployment URL
        run: |
          echo "✅ Cloud Function onUserCreated deployed successfully!"
          echo ""
          echo "From now on, every new Firebase Auth user will automatically"
          echo "get a /users/{uid} Firestore doc created server-side."
          echo ""
          echo "Existing users without docs can either:"
          echo "  1. Manually create docs in Firebase Console, OR"
          echo "  2. Delete the Auth users and re-register (the function"
          echo "     will create the docs automatically)"
