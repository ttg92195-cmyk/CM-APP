name: Flutter Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          echo "Installing Android SDK Platform 36 for media_kit..."
          yes | sdkmanager "platforms;android-36" || true
          yes | sdkmanager "build-tools;36.0.0" || true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.5'

      - name: Clean previous build
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      # Setup signing key — use release keystore from secrets if available,
      # otherwise generate a temporary debug keystore so CI builds succeed
      - name: Setup signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "🔐 Using release keystore from secrets"
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
            echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
            echo "storeFile=keystore.jks" >> android/key.properties
          else
            echo "⚠️ No release keystore secrets found — generating temporary debug keystore for CI"
            keytool -genkeypair \
              -v \
              -keystore android/app/debug-ci.jks \
              -storepass android \
              -alias ci-debug \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 1 \
              -dname "CN=CI Debug, OU=CI, O=CM Movies, L=Yangon, ST=Yangon, C=MM"
            echo "storePassword=android" >> android/key.properties
            echo "keyPassword=android" >> android/key.properties
            echo "keyAlias=ci-debug" >> android/key.properties
            echo "storeFile=debug-ci.jks" >> android/key.properties
          fi

      # Create .env file — app bundles this at build time via flutter_dotenv.
      #
      # PERMANENT FIX (Task 43 recurrence #3, 2026-06-28):
      # Always regenerate .env FROM SCRATCH using GitHub Actions Secrets,
      # ignoring the committed .env entirely. This makes CI immune to
      # .env wipes caused by UUID auto-commits that run 'git add -A'
      # locally (recurring pattern: 0c51c4c, 5516658, 2344757 — each
      # overwrote .env from 14 lines / 8 keys back to 1 line / 1 key).
      #
      # The committed .env is now only used for LOCAL dev. CI's source
      # of truth is GitHub Actions Secrets (all 8 keys configured).
      #
      # If any secret is missing or empty, verify_env.py below will
      # catch it and fail the build with a clear message.
      #
      # Secrets are passed as env vars (not interpolated into the script
      # body) to avoid shell injection risk from secret values.
      - name: Create .env file from secrets
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          ONE_SIGNAL_APP_ID: ${{ secrets.ONE_SIGNAL_APP_ID }}
          ONE_SIGNAL_REST_API_KEY: ${{ secrets.ONE_SIGNAL_REST_API_KEY }}
        run: |
          cat > .env <<EOF
          # Generated by CI from GitHub Actions Secrets — do not edit.
          FIREBASE_API_KEY=$FIREBASE_API_KEY
          FIREBASE_APP_ID=$FIREBASE_APP_ID
          FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID
          FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID
          FIREBASE_STORAGE_BUCKET=$FIREBASE_STORAGE_BUCKET
          TMDB_API_KEY=$TMDB_API_KEY
          ONE_SIGNAL_APP_ID=$ONE_SIGNAL_APP_ID
          ONE_SIGNAL_REST_API_KEY=$ONE_SIGNAL_REST_API_KEY
          EOF
          echo "✓ .env regenerated from secrets ($(wc -l < .env) lines)"

      # Verify .env has all required keys before building. Fails the build
      # loudly if any key is missing/empty — prevents silently shipping a
      # broken APK that 401s on every TMDB call.
      - name: Verify .env has required keys
        run: python3 scripts/verify_env.py

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
