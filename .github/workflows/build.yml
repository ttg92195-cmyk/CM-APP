name: Flutter Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          echo "Installing Android SDK Platform 36 for media_kit..."
          yes | sdkmanager "platforms;android-36" || true
          yes | sdkmanager "build-tools;36.0.0" || true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.5'

      - name: Clean previous build
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      # Setup signing key — use release keystore from secrets if available,
      # otherwise generate a temporary debug keystore so CI builds succeed
      - name: Setup signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "🔐 Using release keystore from secrets"
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
            echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
            echo "storeFile=keystore.jks" >> android/key.properties
          else
            echo "⚠️ No release keystore secrets found — generating temporary debug keystore for CI"
            keytool -genkeypair \
              -v \
              -keystore android/app/debug-ci.jks \
              -storepass android \
              -alias ci-debug \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 1 \
              -dname "CN=CI Debug, OU=CI, O=CM Movies, L=Yangon, ST=Yangon, C=MM"
            echo "storePassword=android" >> android/key.properties
            echo "keyPassword=android" >> android/key.properties
            echo "keyAlias=ci-debug" >> android/key.properties
            echo "storeFile=debug-ci.jks" >> android/key.properties
          fi

      # Create .env file — app bundles this at build time via flutter_dotenv.
      #
      # PERMANENT FIX (Task 43 recurrence #3, 2026-06-28):
      # Hybrid approach — use committed .env as baseline, then override
      # with GitHub Actions Secrets when present. This makes CI immune
      # to .env wipes (auto-commits like 0c51c4c, 5516658, 2344757
      # overwrote .env from 14 lines / 8 keys back to 1 line / 1 key).
      #
      # Semantics:
      #   - If committed .env is present and healthy → provides baseline
      #     values for keys that aren't yet configured as GitHub Secrets
      #   - If committed .env is wiped → secrets provide values alone
      #   - If a secret is set → it overrides committed value (last-wins)
      #   - If a secret is unset/empty → committed value stands (no blank)
      #   - If neither source has a key → verify_env.py below catches it
      #
      # Secrets are passed as env vars (not interpolated into the script
      # body) to avoid shell injection risk from secret values.
      - name: Create .env file from secrets + committed baseline
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          ONE_SIGNAL_APP_ID: ${{ secrets.ONE_SIGNAL_APP_ID }}
        run: |
          # Start from committed .env if it's healthy; otherwise start
          # from an empty file and rely entirely on secrets.
          if [ ! -f .env ] || [ ! -s .env ]; then
            echo "ℹ Committed .env missing or empty (auto-commit wipe?) — building from secrets only"
            rm -f .env
            touch .env
          else
            echo "✓ Committed .env present ($(grep -c '=' .env || echo 0) keys) — using as baseline"
          fi

          # Append GitHub Secrets — dotenv uses last-occurrence-wins,
          # so a present secret overrides the committed value; a missing
          # or empty secret leaves the committed value intact.
          echo "" >> .env
          echo "# GitHub Actions Secrets overrides (added by CI)" >> .env
          [ -n "$FIREBASE_API_KEY" ]             && echo "FIREBASE_API_KEY=$FIREBASE_API_KEY" >> .env
          [ -n "$FIREBASE_APP_ID" ]              && echo "FIREBASE_APP_ID=$FIREBASE_APP_ID" >> .env
          [ -n "$FIREBASE_MESSAGING_SENDER_ID" ] && echo "FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID" >> .env
          [ -n "$FIREBASE_PROJECT_ID" ]          && echo "FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID" >> .env
          [ -n "$FIREBASE_STORAGE_BUCKET" ]      && echo "FIREBASE_STORAGE_BUCKET=$FIREBASE_STORAGE_BUCKET" >> .env
          [ -n "$TMDB_API_KEY" ]                 && echo "TMDB_API_KEY=$TMDB_API_KEY" >> .env
          [ -n "$ONE_SIGNAL_APP_ID" ]            && echo "ONE_SIGNAL_APP_ID=$ONE_SIGNAL_APP_ID" >> .env

          echo "✓ .env final state: $(wc -l < .env) lines"

      # Verify .env has all required keys before building. Fails the build
      # loudly if any key is missing/empty — prevents silently shipping a
      # broken APK that 401s on every TMDB call.
      - name: Verify .env has required keys
        run: python3 scripts/verify_env.py

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
