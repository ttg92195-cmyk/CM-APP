name: Flutter Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          echo "Installing Android SDK Platform 36 for media_kit..."
          yes | sdkmanager "platforms;android-36" || true
          yes | sdkmanager "build-tools;36.0.0" || true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.5'

      - name: Clean previous build
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      # Setup signing key — use release keystore from secrets if available,
      # otherwise generate a temporary debug keystore so CI builds succeed
      - name: Setup signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "🔐 Using release keystore from secrets"
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
            echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
            echo "storeFile=keystore.jks" >> android/key.properties
          else
            echo "⚠️ No release keystore secrets found — generating temporary debug keystore for CI"
            keytool -genkeypair \
              -v \
              -keystore android/app/debug-ci.jks \
              -storepass android \
              -alias ci-debug \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 1 \
              -dname "CN=CI Debug, OU=CI, O=CM Movies, L=Yangon, ST=Yangon, C=MM"
            echo "storePassword=android" >> android/key.properties
            echo "keyPassword=android" >> android/key.properties
            echo "keyAlias=ci-debug" >> android/key.properties
            echo "storeFile=debug-ci.jks" >> android/key.properties
          fi

      # Create .env file — app bundles this at build time via flutter_dotenv.
      #
      # The repo has a committed .env with real keys (see .gitignore comment).
      # This step APPENDS GitHub-secret-sourced overrides on top of the
      # committed .env. dotenv uses last-occurrence-wins, so non-empty
      # secrets override committed values; empty/unset secrets are skipped
      # (guard via `if [ -n "..." ]`) so they DON'T overwrite committed
      # values with blanks.
      #
      # History: this step used to only write 5 Firebase keys, missing
      # TMDB_API_KEY + OneSignal. Every CI-built APK shipped without
      # TMDB_API_KEY → HTTP 401 on every TMDB call. Fixed Task 38 follow-up.
      - name: Create .env file
        run: |
          # Firebase (existing — keep appending without guard to preserve
          # current behavior; Firebase secrets are known to be configured).
          echo "FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}" >> .env
          echo "FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}" >> .env
          echo "FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}" >> .env
          echo "FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}" >> .env
          echo "FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}" >> .env
          # TMDB + OneSignal (new — guard so empty secret doesn't overwrite
          # the committed value with a blank).
          if [ -n "${{ secrets.TMDB_API_KEY }}" ]; then
            echo "TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}" >> .env
          fi
          if [ -n "${{ secrets.ONE_SIGNAL_APP_ID }}" ]; then
            echo "ONE_SIGNAL_APP_ID=${{ secrets.ONE_SIGNAL_APP_ID }}" >> .env
          fi
          if [ -n "${{ secrets.ONE_SIGNAL_REST_API_KEY }}" ]; then
            echo "ONE_SIGNAL_REST_API_KEY=${{ secrets.ONE_SIGNAL_REST_API_KEY }}" >> .env
          fi

      # Verify .env has all required keys before building. Fails the build
      # loudly if any key is missing/empty — prevents silently shipping a
      # broken APK that 401s on every TMDB call.
      - name: Verify .env has required keys
        run: python3 scripts/verify_env.py

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
