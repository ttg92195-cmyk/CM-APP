name: Sync & Deploy Poster Mirror

# =============================================================================
# TMDB POSTER MIRROR — Phase 4 hotfix (2026-09-16) / jsDelivr era (2026-10-16)
# =============================================================================
# WHY (latest): BOTH Google serving domains broke from Myanmar — *.web.app
# is ISP-blocked (2026-09-19, and again after a brief reprieve) and even
# storage.googleapis.com stopped loading reliably there (2026-10-16), while
# cdn.jsdelivr.net (multi-CDN edge: Cloudflare/Fastly/…) stays reachable
# (user-verified on a Myanmar line, 2026-10-16). Bonus: Firebase Hosting
# storage was already at 80.7% of the 10GB Spark cap — jsDelivr takes that
# quota out of the serving path entirely.
#
# WHAT: Mirrors every TMDB image referenced in Firestore into hosting/t/p/…
# (committed to this public GitHub repo) AND uploads them to the public
# Firebase default GCS bucket, so the app can load posters from EITHER of:
#   https://cdn.jsdelivr.net/gh/ttg92195-cmyk/CM-APP@main/hosting/t/p/w500/<f>.jpg  ← primary
#   https://storage.googleapis.com/cm-movies-dabab.firebasestorage.app/t/p/w500/<f>.jpg ← backup
#   https://cm-movies-dabab.web.app/t/p/w500/<f>.jpg                               ← backup
# with ZERO app changes — the sync script sets the Firestore remote config:
#   app_settings/tmdb_image_proxy.baseUrl
#     → jsDelivr (when the CDN probe passes; else GCS → hosting fallback)
#
# BUCKET NOTE: creating a NEW bucket needs a billing account (fails on the
# free plan), but the Firebase DEFAULT bucket works without billing. If it
# doesn't exist yet, create it once: Firebase Console → Build → Storage →
# "Get started" (free, no card). The sync then auto-detects it.
# (POSTER_BUCKET env can override the preferred bucket name.)
#
# WHEN:
#   - Manually (Actions → Run workflow) — run after adding new movies!
#   - Nightly at 01:00 Myanmar time (19:30 UTC) — picks up new content
#   - On push that changes this workflow or the sync script
#
# PREREQUISITE (same secret the functions workflow needs):
#   GitHub secret FIREBASE_SERVICE_ACCOUNT = the Firebase service account
#   JSON key. To create it (free, no Blaze needed):
#     1. Firebase Console → ⚙️ Project settings → Service accounts
#     2. "Generate new private key" → downloads a JSON file
#     3. GitHub repo → Settings → Secrets and variables → Actions
#     4. New repository secret → name FIREBASE_SERVICE_ACCOUNT
#        → value = the ENTIRE JSON file contents
#
# LIMITS (free tiers — this project has NO billing account, so caps are
# hard-capped, never billed):
#   jsDelivr (primary): free public CDN for GitHub repos — 20MB max/file
#                   (largest mirror file < 2MB), no request/bandwidth cap,
#                   @main branch URLs cached ~12h at the edges (fits the
#                   nightly cadence; new posters appear within ~12h of the
#                   bot commit), repo must stay public. Community service,
#                   no SLA — if it ever degrades, flip baseUrl to a backup.
#   GCS (backup):   5GB storage (current mirror ≈ 267MB), 1GB egress,
#                   50k anonymous object GETs/month.
#   Hosting (backup): 10GB storage — 80.7% ALREADY USED (8.1GB of old
#                   releases); consider Blaze or release cleanup if the
#                   deploy step starts failing.
# =============================================================================

on:
  workflow_dispatch:
  schedule:
    - cron: '30 19 * * *' # 19:30 UTC = 01:00 MMT daily
  push:
    branches: [main]
    paths:
      - 'scripts/sync-posters.js'
      - '.github/workflows/sync-posters.yml'
      - 'firebase.json'

permissions:
  contents: write # commit newly mirrored posters back to the repo

concurrency:
  group: sync-posters
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    env:
      # secrets context is forbidden in job-level if: — map to env first
      # (same pattern as deploy-functions.yml).
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_PROJECT_ID: cm-movies-dabab

    steps:
      - name: Explain what to do when the secret is missing
        if: env.FIREBASE_SERVICE_ACCOUNT == ''
        run: |
          echo "::error::Secret FIREBASE_SERVICE_ACCOUNT is not configured — skipping."
          echo "To enable poster mirror deploys:"
          echo "  1. Firebase Console → ⚙️ Project settings → Service accounts"
          echo "  2. Click 'Generate new private key' (free, no Blaze needed)"
          echo "  3. GitHub → Settings → Secrets and variables → Actions"
          echo "  4. New secret: FIREBASE_SERVICE_ACCOUNT = entire JSON contents"
          echo "  5. Re-run this workflow"

      - name: Checkout code
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: actions/checkout@v4

      - name: Set up Node
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install firebase-admin + @google-cloud/storage (isolated, outside the repo tree)
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        # @google-cloud/storage is needed for bucket CREATE — firebase-admin's
        # admin.storage() facade exposes only bucket(). It also ships as a
        # firebase-admin dep; installing it explicitly guarantees resolution.
        run: npm install --prefix "$RUNNER_TEMP/poster-deps" firebase-admin@12 @google-cloud/storage@7

      - name: Deploy Storage Rules (public poster read — best effort)
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        # Runs BEFORE the sync so the /t/** public-read rule is already live
        # when the sync's anonymous public-GET verification runs. Tolerates
        # failure: the default bucket may not exist yet (it is created by
        # Firebase Console → Storage → "Get started" — or possibly by this
        # very deploy, which we probe for in the next step either way).
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/poster-sa.json
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/poster-sa.json"
          npx -y firebase-tools deploy --only storage --non-interactive \
            --project "$FIREBASE_PROJECT_ID" \
            || echo "::warning::storage rules deploy failed (bucket may not exist yet)"

      - name: Sync posters from TMDB into hosting/ + GCS
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        env:
          NODE_PATH: ${{ runner.temp }}/poster-deps/node_modules
        run: node scripts/sync-posters.js

      - name: Commit newly mirrored posters
        if: env.FIREBASE_SERVICE_ACCOUNT != '' && success()
        # 2026-10-03 fix: the sync takes minutes, and other commits (app
        # fixes, worklog docs) can land on main meanwhile — a bare
        # `git push` then gets rejected (non-fast-forward) and the whole
        # run fails, losing the freshly downloaded posters with the
        # runner. Rebase on the latest main and retry before giving up.
        run: |
          git config user.name "poster-sync-bot"
          git config user.email "actions@github.com"
          git add hosting/
          if git diff --cached --quiet; then
            echo "No new posters to commit."
          else
            git commit -m "chore(posters): mirror new TMDB posters [skip ci]"
            ok=0
            for attempt in 1 2 3 4; do
              if git pull --rebase -X theirs origin main && git push origin main; then
                ok=1
                echo "Committed and pushed new posters (attempt $attempt)."
                break
              fi
              echo "::warning::push attempt $attempt failed — rebasing on latest main and retrying..."
              sleep $((attempt * 15))
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::Could not push after 4 attempts (main kept moving) — re-run this workflow later; nothing is lost, the sync just re-downloads."
              exit 1
            fi
          fi

      - name: Deploy to Firebase Hosting
        if: env.FIREBASE_SERVICE_ACCOUNT != '' && success()
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/poster-sa.json
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/poster-sa.json"
          npx -y firebase-tools deploy --only hosting --non-interactive \
            --project "$FIREBASE_PROJECT_ID"

      - name: Summary
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        run: |
          echo "### Poster mirror synced :cinema:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Primary (Myanmar-reachable, user-verified 2026-10-16): https://cdn.jsdelivr.net/gh/ttg92195-cmyk/CM-APP@main/hosting/t/p/w500/yihdXomYb5kTeSivtFndMy5iDmf.jpg" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backups: https://cm-movies-dabab.web.app/ · GCS bucket ${POSTER_BUCKET:-cm-movies-dabab.firebasestorage.app}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The sync sets the app config automatically (app_settings/" >> "$GITHUB_STEP_SUMMARY"
          echo "tmdb_image_proxy: baseUrl=https://cdn.jsdelivr.net/gh/ttg92195-cmyk/CM-APP@main/hosting when the CDN probe passes)." >> "$GITHUB_STEP_SUMMARY"
          echo "If posters don't show in the app: force-close and reopen it, or" >> "$GITHUB_STEP_SUMMARY"
          echo "Settings → About → tap the TMDB Poster Proxy row to reload." >> "$GITHUB_STEP_SUMMARY"
